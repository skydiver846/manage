<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>교육생 출석부</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    /* 레이아웃: 좁은 단일 컬럼 — 상단 요약, 입력 폼, 출석 명단 순 */
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --fg: #1b2230;
      --muted: #5d6676;
      --line: #dde1e8;
      --accent: #c8321e;       /* 소방 적색 */
      --ok: #1f7a4d;
      --late: #a35f00;
      --font-display: "Black Han Sans", "IBM Plex Sans KR", system-ui, sans-serif;
      --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12161d; --surface: #1b212b; --fg: #e8ebf0; --muted: #9aa3b2;
        --line: #2c3442; --accent: #ff6a52; --ok: #4cc58a; --late: #f0a840;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #12161d; --surface: #1b212b; --fg: #e8ebf0; --muted: #9aa3b2;
      --line: #2c3442; --accent: #ff6a52; --ok: #4cc58a; --late: #f0a840;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.6 var(--font-body);
    }
    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding-inline: 16px;
      padding-block: 32px 48px;
      display: grid;
      gap: 24px;
    }
    header { display: grid; gap: 4px; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .08em;
      color: var(--accent);
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 34px;
      line-height: 1.15;
      text-wrap: balance;
    }
    header p { margin: 0; color: var(--muted); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }
    .stat { padding: 12px 14px; display: grid; gap: 2px; }
    .stat + .stat { border-left: 1px solid var(--line); }
    .stat span { font-size: 12px; color: var(--muted); }
    .stat strong {
      font-family: var(--font-mono);
      font-size: 24px;
      font-variant-numeric: tabular-nums;
    }

    form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
    .field { flex: 1 1 200px; display: grid; gap: 4px; min-width: 0; }
    .field.short { flex: 0 1 110px; }
    label { font-size: 13px; font-weight: 600; }
    input {
      width: 100%;
      min-width: 0;
      font: inherit;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--fg);
    }
    button {
      font: inherit;
      font-weight: 600;
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button:disabled, input:disabled { opacity: .5; cursor: not-allowed; }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .error { margin: 0; color: var(--accent); font-size: 13px; min-height: 1.6em; flex-basis: 100%; }

    .list-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .list-head h2 { margin: 0; font-size: 16px; }
    .status {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid currentColor;
      color: var(--muted);
    }
    .status.live { color: var(--ok); }
    .status.down { color: var(--accent); }
    ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    li {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 2px;
      border-bottom: 1px solid var(--line);
    }
    .time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--muted); }
    .who { min-width: 0; overflow-wrap: anywhere; }
    .chip {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid currentColor;
    }
    .chip.ok { color: var(--ok); }
    .chip.late { color: var(--late); }
    li.empty { display: block; color: var(--muted); padding: 16px 2px; }
    .note { font-size: 12px; color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow">신임소방관 교육과정 · 제12기</span>
      <h1>교육생 출석부</h1>
      <p id="today"></p>
    </header>

    <section class="stats" aria-label="출석 요약">
      <div class="stat"><span>출석</span><strong id="count-total">0</strong></div>
      <div class="stat"><span>정시</span><strong id="count-ok">0</strong></div>
      <div class="stat"><span>지각 (09:00 이후)</span><strong id="count-late">0</strong></div>
    </section>

    <form id="checkin-form" novalidate>
      <div class="field">
        <label for="name">교육생 이름</label>
        <input id="name" autocomplete="off" maxlength="20" placeholder="예: 김소방">
      </div>
      <div class="field short">
        <label for="no">교육생 번호</label>
        <input id="no" inputmode="numeric" maxlength="2" autocomplete="off" placeholder="예: 01">
      </div>
      <button type="submit" id="submit">출석 체크</button>
      <p class="error" id="error" role="alert"></p>
    </form>

    <section>
      <div class="list-head">
        <h2>오늘의 출석 명단</h2>
        <span class="status" id="status">연결 중…</span>
      </div>
      <ul id="list"></ul>
    </section>

    <p class="note" id="note">기록은 공용 장부(Firebase Firestore)에 저장되어 모든 기기에서 같은 명단이 보입니다. 잘못된 기록은 강사가 Firebase 콘솔에서 지웁니다.</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import {
      getFirestore, connectFirestoreEmulator,
      collection, query, where, onSnapshot, doc, getDoc, setDoc,
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    // ▼▼▼ 모듈 09 4단계에서 복사한 내 firebaseConfig로 이 부분만 바꾸세요 ▼▼▼
    const firebaseConfig = {
      apiKey: "여기에-apiKey",
      authDomain: "여기에-프로젝트ID.firebaseapp.com",
      projectId: "여기에-프로젝트ID",
      storageBucket: "여기에-프로젝트ID.firebasestorage.app",
      messagingSenderId: "여기에-messagingSenderId",
      appId: "여기에-appId",
    };
    // ▲▲▲ 여기까지 ▲▲▲

    const COLLECTION = "attendance";          // 3단계 보안 규칙의 컬렉션 이름과 같아야 한다
    const LATE_AFTER = { h: 9, m: 0 };

    // 강사 시험용: 주소 끝에 ?emulator 를 붙이면 내 컴퓨터의 Firestore 에뮬레이터에 연결한다.
    const useEmulator = new URLSearchParams(location.search).has("emulator");
    const configured = useEmulator || !firebaseConfig.projectId.startsWith("여기에");

    const $ = (id) => document.getElementById(id);
    const pad2 = (n) => String(n).padStart(2, "0");

    function todayStr() {
      const d = new Date();
      return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
    }

    function nowHHMM() {
      const d = new Date();
      return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    }

    function isLate(time) {
      const [h, m] = time.split(":").map(Number);
      return h > LATE_AFTER.h || (h === LATE_AFTER.h && m > LATE_AFTER.m);
    }

    function setStatus(text, kind) {
      $("status").textContent = text;
      $("status").className = "status" + (kind ? " " + kind : "");
    }

    function render(records) {
      const list = $("list");
      list.innerHTML = "";
      if (records.length === 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = configured
          ? "아직 출석한 교육생이 없습니다. 위에서 이름과 번호를 입력해 첫 출석을 기록하세요."
          : "Firebase 설정값이 아직 없습니다. 코드의 firebaseConfig를 내 프로젝트 값으로 바꾸면 명단이 나타납니다.";
        list.append(li);
      }
      for (const r of records) {
        const late = isLate(r.time);
        const li = document.createElement("li");
        li.innerHTML =
          '<span class="time"></span><span class="who"></span>' +
          '<span class="chip ' + (late ? "late" : "ok") + '">' + (late ? "지각" : "정시") + "</span>";
        li.querySelector(".time").textContent = r.time;
        li.querySelector(".who").textContent = r.name + " · " + r.no;
        list.append(li);
      }
      const late = records.filter((r) => isLate(r.time)).length;
      $("count-total").textContent = records.length;
      $("count-late").textContent = late;
      $("count-ok").textContent = records.length - late;
    }

    $("today").textContent = new Date().toLocaleDateString("ko-KR", {
      year: "numeric", month: "long", day: "numeric", weekday: "long",
    }) + " · 09:00 이후 체크는 지각 처리";

    if (!configured) {
      // 설정값 없이 열었을 때: 화면만 보여 주고 입력은 막는다.
      for (const el of $("checkin-form").elements) el.disabled = true;
      setStatus("설정 필요", "down");
      render([]);
    } else {
      const app = initializeApp(useEmulator ? { apiKey: "demo", projectId: "demo-attendance" } : firebaseConfig);
      const db = getFirestore(app);
      if (useEmulator) connectFirestoreEmulator(db, "127.0.0.1", 8080);

      // 오늘 날짜 기록만 실시간으로 받는다. 정렬은 화면에서 한다 (색인 불필요).
      const today = todayStr();
      onSnapshot(
        query(collection(db, COLLECTION), where("date", "==", today)),
        (snap) => {
          const records = snap.docs.map((d) => d.data())
            .sort((a, b) => a.time.localeCompare(b.time) || a.no.localeCompare(b.no));
          render(records);
          setStatus("실시간 연결됨", "live");
        },
        (err) => {
          setStatus("연결 안 됨", "down");
          $("error").textContent = err.code === "permission-denied"
            ? "명단을 읽을 권한이 없습니다. Firestore 규칙(3단계)을 게시했는지 확인하세요."
            : "공용 장부에 연결하지 못했습니다 (" + err.code + "). 설정값과 인터넷 연결을 확인하세요.";
        },
      );

      $("checkin-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = $("name").value.trim();
        const rawNo = $("no").value.trim();
        if (!name || !/^\d{1,2}$/.test(rawNo)) {
          $("error").textContent = "이름과 교육생 번호(숫자 2자리)를 입력한 뒤 출석 체크를 누르세요.";
          return;
        }
        if (name.includes("/")) {
          $("error").textContent = "이름에는 / 기호를 쓸 수 없습니다.";
          return;
        }
        const no = rawNo.padStart(2, "0");
        const date = todayStr();
        // 문서 ID = 날짜_번호_이름. 같은 날 같은 사람이 다시 쓰면 "고치기"가 되어 규칙이 거절한다.
        const ref = doc(db, COLLECTION, date + "_" + no + "_" + name);

        $("submit").disabled = true;
        try {
          if ((await getDoc(ref)).exists()) {
            $("error").textContent = name + "(" + no + "번) 교육생은 이미 출석했습니다.";
            return;
          }
          await setDoc(ref, { name, no, date, time: nowHHMM() });
          $("error").textContent = "";
          $("name").value = "";
          $("no").value = "";
        } catch (err) {
          $("error").textContent = err.code === "permission-denied"
            ? "장부 규칙에 맞지 않아 저장하지 못했습니다. 이미 출석했거나, 규칙(3단계)과 코드의 칸 이름이 다릅니다."
            : "저장하지 못했습니다 (" + err.code + "). 인터넷 연결을 확인하세요.";
        } finally {
          $("submit").disabled = false;
        }
      });
    }
  </script>
</body>
</html>
