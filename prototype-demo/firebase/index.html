<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>구내식당 메뉴 만족도 (공용 장부)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    /* 레이아웃: 좁은 단일 컬럼 — 상단 요약, 입력 폼, 결과표 순 */
    :root {
      --bg: #f3f4f6;
      --surface: #ffffff;
      --fg: #1b2230;
      --muted: #5d6676;
      --line: #dde1e8;
      --accent: #c8321e;       /* 소방 적색 */
      --ok: #1f7a4d;
      --late: #a35f00;
      --font-display: "Black Han Sans", "IBM Plex Sans KR", system-ui, sans-serif;
      --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif;
      --font-mono: "IBM Plex Mono", ui-monospace, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12161d; --surface: #1b212b; --fg: #e8ebf0; --muted: #9aa3b2;
        --line: #2c3442; --accent: #ff6a52; --ok: #4cc58a; --late: #f0a840;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #12161d; --surface: #1b212b; --fg: #e8ebf0; --muted: #9aa3b2;
      --line: #2c3442; --accent: #ff6a52; --ok: #4cc58a; --late: #f0a840;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.6 var(--font-body);
    }
    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding-inline: 16px;
      padding-block: 32px 48px;
      display: grid;
      gap: 24px;
    }
    header { display: grid; gap: 4px; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .08em;
      color: var(--accent);
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 34px;
      line-height: 1.15;
      text-wrap: balance;
    }
    header p { margin: 0; color: var(--muted); }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }
    .stat { padding: 12px 14px; display: grid; gap: 2px; }
    .stat + .stat { border-left: 1px solid var(--line); }
    .stat span { font-size: 12px; color: var(--muted); }
    .stat strong {
      font-family: var(--font-mono);
      font-size: 24px;
      font-variant-numeric: tabular-nums;
    }

    form { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
    .field { flex: 1 1 200px; display: grid; gap: 4px; min-width: 0; }
    .field.short { flex: 0 1 120px; }
    .field.mid { flex: 1 1 140px; }
    label { font-size: 13px; font-weight: 600; }
    input, select {
      width: 100%;
      min-width: 0;
      font: inherit;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--fg);
    }
    button {
      font: inherit;
      font-weight: 600;
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    button.ghost {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 6px 12px;
      font-size: 13px;
    }
    input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .error { margin: 0; color: var(--accent); font-size: 13px; min-height: 1.6em; flex-basis: 100%; }

    .list-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .list-head h2 { margin: 0; font-size: 16px; }
    .status {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 999px;
      border: 1px solid currentColor;
      color: var(--muted);
    }
    .status.live { color: var(--ok); }
    .status.down { color: var(--accent); }
    button:disabled, input:disabled, select:disabled { opacity: .5; cursor: not-allowed; }
    .list-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    table { width: 100%; border-collapse: collapse; border-top: 1px solid var(--line); }
    th, td { padding: 10px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th { font-size: 12px; font-weight: 600; color: var(--muted); }
    th.num, td.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
    td.who { overflow-wrap: anywhere; }
    td.who small { display: block; color: var(--muted); font-size: 13px; }
    td.state { text-align: right; white-space: nowrap; }
    .chip {
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid currentColor;
    }
    .chip.ok { color: var(--ok); }
    .chip.bad { color: var(--accent); }
    tr.bad td.num.avg { color: var(--accent); font-weight: 600; }
    .empty { color: var(--muted); padding: 16px 2px; }
    .note { font-size: 12px; color: var(--muted); margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow">구내식당 · 10월 2주차 (10. 12.~10. 16.)</span>
      <h1>구내식당 메뉴 만족도</h1>
      <p>만족도 1~5점 · 평균 <strong>3.5 미만</strong>은 “개선 필요”로 표시</p>
    </header>

    <section class="stats" aria-label="평가 요약">
      <div class="stat"><span>응답</span><strong id="count-total">0</strong></div>
      <div class="stat"><span>평가 메뉴</span><strong id="count-menu">0</strong></div>
      <div class="stat"><span>개선 필요</span><strong id="count-bad">0</strong></div>
    </section>

    <form id="eval-form" novalidate>
      <div class="field">
        <label for="menu">메뉴</label>
        <input id="menu" list="menu-list" autocomplete="off" maxlength="30" placeholder="예: 김치찌개">
        <datalist id="menu-list"></datalist>
      </div>
      <div class="field mid">
        <label for="meal">식사</label>
        <select id="meal">
          <option value="">선택</option>
          <option value="점심">점심</option>
          <option value="저녁">저녁</option>
        </select>
      </div>
      <div class="field short">
        <label for="score">만족도</label>
        <select id="score">
          <option value="">선택</option>
          <option value="5">5 매우 만족</option>
          <option value="4">4 만족</option>
          <option value="3">3 보통</option>
          <option value="2">2 불만족</option>
          <option value="1">1 매우 불만족</option>
        </select>
      </div>
      <button type="submit" id="submit">평가 제출</button>
      <p class="error" id="error" role="alert"></p>
    </form>

    <section>
      <div class="list-head">
        <h2>메뉴·식사별 결과</h2>
        <span class="status" id="status">연결 중…</span>
      </div>
      <table>
        <thead>
          <tr><th>메뉴 · 식사</th><th class="num">응답</th><th class="num">평균</th><th class="num">상태</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>

    <p class="note" id="note">응답은 공용 장부(Firebase Firestore)에 익명으로 저장되어 모든 기기에서 같은 결과가 보입니다. 잘못 낸 응답은 급식 담당자가 Firebase 콘솔에서 지웁니다.</p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import {
      getFirestore, connectFirestoreEmulator,
      collection, onSnapshot, addDoc,
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    // ▼▼▼ 모듈 10 4단계에서 복사한 내 firebaseConfig로 이 부분만 바꾸세요 ▼▼▼
    const firebaseConfig = {
      apiKey: "여기에-apiKey",
      authDomain: "여기에-프로젝트ID.firebaseapp.com",
      projectId: "여기에-프로젝트ID",
      storageBucket: "여기에-프로젝트ID.firebasestorage.app",
      messagingSenderId: "여기에-messagingSenderId",
      appId: "여기에-appId",
    };
    // ▲▲▲ 여기까지 ▲▲▲

    const COLLECTION = "ratings";             // 3단계 보안 규칙의 컬렉션 이름과 같아야 한다
    const THRESHOLD = 3.5;                    // 평균이 이 값보다 낮으면 개선 필요 (PRD)

    // 강사 시험용: 주소 끝에 ?emulator 를 붙이면 내 컴퓨터의 Firestore 에뮬레이터에 연결한다.
    const useEmulator = new URLSearchParams(location.search).has("emulator");
    const configured = useEmulator || !firebaseConfig.projectId.startsWith("여기에");

    const $ = (id) => document.getElementById(id);
    const pad2 = (n) => String(n).padStart(2, "0");

    function todayStr() {
      const d = new Date();
      return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
    }

    function setStatus(text, kind) {
      $("status").textContent = text;
      $("status").className = "status" + (kind ? " " + kind : "");
    }

    // 메뉴 + 식사(점심/저녁)가 같은 응답끼리 묶어 응답 수와 평균을 낸다 (PRD v0.3: 같은 메뉴라도 점심·저녁은 따로 집계).
    function summarize(records) {
      const groups = new Map();
      records.forEach((r) => {
        const key = r.menu + "\u0000" + r.meal;
        if (!groups.has(key)) groups.set(key, { menu: r.menu, meal: r.meal, count: 0, sum: 0 });
        const g = groups.get(key);
        g.count += 1;
        g.sum += r.score;
      });
      return [...groups.values()]
        .map((g) => ({ ...g, avg: Math.round((g.sum / g.count) * 10) / 10 }))
        .map((g) => ({ ...g, bad: g.avg < THRESHOLD }))
        .sort((a, b) => a.avg - b.avg || a.menu.localeCompare(b.menu, "ko"));   // 평균이 낮은 것부터
    }

    function render(records) {
      const rows = $("rows");
      rows.innerHTML = "";
      const groups = summarize(records);
      if (groups.length === 0) {
        const tr = document.createElement("tr");
        tr.innerHTML = '<td class="empty" colspan="4"></td>';
        tr.firstChild.textContent = configured
          ? "아직 응답이 없습니다. 위에서 메뉴, 식사, 만족도를 골라 첫 응답을 제출하세요."
          : "Firebase 설정값이 아직 없습니다. 코드의 firebaseConfig를 내 프로젝트 값으로 바꾸면 결과표가 나타납니다.";
        rows.append(tr);
      }
      groups.forEach((g) => {
        const tr = document.createElement("tr");
        if (g.bad) tr.className = "bad";
        tr.innerHTML =
          '<td class="who"><span></span><small></small></td>' +
          '<td class="num"></td><td class="num avg"></td>' +
          '<td class="state"><span class="chip ' + (g.bad ? "bad" : "ok") + '">' + (g.bad ? "개선 필요" : "양호") + "</span></td>";
        tr.querySelector(".who span").textContent = g.menu;
        tr.querySelector(".who small").textContent = g.meal;
        tr.children[1].textContent = g.count;
        tr.children[2].textContent = g.avg.toFixed(1);
        rows.append(tr);
      });

      const menus = new Set(records.map((r) => r.menu));
      $("count-total").textContent = records.length;
      $("count-menu").textContent = menus.size;
      $("count-bad").textContent = groups.filter((g) => g.bad).length;
      $("menu-list").innerHTML = "";
      menus.forEach((s) => {
        const o = document.createElement("option");
        o.value = s;
        $("menu-list").append(o);
      });
    }

    if (!configured) {
      // 설정값 없이 열었을 때: 화면만 보여 주고 입력은 막는다.
      for (const el of $("eval-form").elements) el.disabled = true;
      setStatus("설정 필요", "down");
      render([]);
    } else {
      const app = initializeApp(useEmulator ? { apiKey: "demo", projectId: "demo-cafeteria-survey" } : firebaseConfig);
      const db = getFirestore(app);
      if (useEmulator) connectFirestoreEmulator(db, "127.0.0.1", 8080);

      // 모든 응답을 실시간으로 받는다. 집계와 정렬은 화면에서 한다 (색인 불필요).
      onSnapshot(
        collection(db, COLLECTION),
        (snap) => {
          render(snap.docs.map((d) => d.data()));
          setStatus("실시간 연결됨", "live");
        },
        (err) => {
          setStatus("연결 안 됨", "down");
          $("error").textContent = err.code === "permission-denied"
            ? "결과를 읽을 권한이 없습니다. Firestore 규칙(3단계)을 게시했는지 확인하세요."
            : "공용 장부에 연결하지 못했습니다 (" + err.code + "). 설정값과 인터넷 연결을 확인하세요.";
        },
      );

      $("eval-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const menu = $("menu").value.trim().replace(/\s+/g, " ");
        const meal = $("meal").value;   // 점심 또는 저녁 (고르지 않으면 빈 값)
        const score = Number($("score").value);
        if (!menu || (meal !== "점심" && meal !== "저녁") || !Number.isInteger(score) || score < 1 || score > 5) {
          $("error").textContent = "메뉴, 식사, 만족도를 모두 입력한 뒤 제출하세요.";
          return;
        }

        $("submit").disabled = true;
        try {
          // 문서 ID는 Firestore가 자동으로 만든다 (익명 응답이라 사람을 구분하지 않는다).
          await addDoc(collection(db, COLLECTION), { menu, meal, score, date: todayStr() });
          $("error").textContent = "";
          $("score").value = "";
        } catch (err) {
          $("error").textContent = err.code === "permission-denied"
            ? "장부 규칙에 맞지 않아 저장하지 못했습니다. 규칙(3단계)과 코드의 칸 이름이 같은지 확인하세요."
            : "저장하지 못했습니다 (" + err.code + "). 인터넷 연결을 확인하세요.";
        } finally {
          $("submit").disabled = false;
        }
      });
    }
  </script>
</body>
</html>
