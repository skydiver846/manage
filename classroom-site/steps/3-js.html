<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>교육생 출석부 - 3단계 JavaScript</title>

  <!--
    3단계: JavaScript = 움직이는 근육
    HTML과 CSS는 2단계와 같습니다. 맨 아래 <script> 안에 "버튼을 누르면 무엇을 할지"를 더했습니다.
    이제 명단은 미리 적어 둔 글이 아니라, 출석할 때마다 새로 생깁니다.
  -->
  <style>
    /* 페이지 전체: 배경색, 글자 */
    body {
      margin: 0;
      background: #f3f4f6;
      color: #1b2230;
      font-family: system-ui, "Apple SD Gothic Neo", sans-serif;
      line-height: 1.6;
    }

    /* 가운데 정렬된 좁은 기둥: 휴대폰에서도 보기 좋게 */
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 { margin: 0; font-size: 32px; }
    .sub { margin: 4px 0 24px; color: #5d6676; }

    /* 입력 영역: 칸과 버튼을 한 줄에, 좁으면 다음 줄로 */
    form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    .field { display: grid; gap: 4px; flex: 1 1 160px; }
    label { font-size: 13px; font-weight: 600; }
    input {
      padding: 10px 12px;
      border: 1px solid #dde1e8;
      border-radius: 8px;
      font-size: 15px;
    }

    /* 출석 버튼: 소방 적색 */
    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #c8321e;
      color: white;
      font-size: 15px;
      font-weight: 600;
    }

    /* 명단: 줄마다 구분선 */
    ul { list-style: none; padding: 0; border-top: 1px solid #dde1e8; }
    li { padding: 10px 2px; border-bottom: 1px solid #dde1e8; }
    .time { color: #5d6676; margin-right: 12px; }

    /* 정시/지각 표시: 색으로 구분 */
    .ok   { color: #1f7a4d; font-weight: 600; }
    .late { color: #a35f00; font-weight: 600; }
    .error { flex-basis: 100%; margin: 0; color: #c8321e; font-size: 13px; min-height: 1.6em; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>교육생 출석부</h1>
    <p class="sub">신임소방관 교육과정 · 09:00 이후 체크는 지각 처리</p>

    <form id="checkin-form">
      <div class="field">
        <label for="name">교육생 이름</label>
        <input id="name" placeholder="예: 김소방">
      </div>
      <div class="field">
        <label for="no">교육생 번호</label>
        <input id="no" placeholder="예: 01">
      </div>
      <button type="submit">출석 체크</button>
      <p class="error" id="error"></p>
    </form>

    <h2>오늘의 출석 명단 (<span id="count">0</span>명)</h2>
    <ul id="list"></ul>
  </div>

  <script>
    // 1) 화면에서 필요한 부분을 id로 찾아 둔다
    const form = document.getElementById("checkin-form");
    const list = document.getElementById("list");
    const count = document.getElementById("count");
    const error = document.getElementById("error");

    // 2) 지금 시각을 "08:41" 모양으로 만든다
    function nowHHMM() {
      const d = new Date();
      return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }

    // 3) 09:00 이후면 지각 (PRD의 규칙을 코드로 옮긴 부분)
    function isLate(time) {
      return time > "09:00";
    }

    // 4) 출석 체크 버튼을 누르면 실행된다
    form.addEventListener("submit", function (event) {
      event.preventDefault();   // 페이지가 새로고침되지 않게 막는다

      const name = document.getElementById("name").value.trim();
      const no = document.getElementById("no").value.trim();
      if (name === "" || no === "") {
        error.textContent = "이름과 번호를 모두 입력하세요.";
        return;
      }

      // 명단에 한 줄 추가
      const time = nowHHMM();
      const li = document.createElement("li");
      const timeEl = document.createElement("span");
      timeEl.className = "time";
      timeEl.textContent = time;
      const badge = document.createElement("span");
      badge.className = isLate(time) ? "late" : "ok";
      badge.textContent = isLate(time) ? "지각" : "정시";
      li.append(timeEl, name + " · " + no + " ", badge);
      list.append(li);

      // 숫자 늘리고, 입력칸 비우기
      count.textContent = list.children.length;
      error.textContent = "";
      form.reset();
    });
  </script>
</body>
</html>
