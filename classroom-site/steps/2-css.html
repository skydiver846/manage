<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>교육생 출석부 - 2단계 CSS</title>

  <!--
    2단계: CSS = 옷과 인테리어
    HTML은 1단계와 거의 같습니다. <style> 안에 "어떤 것을 어떻게 보이게 할지"만 더했습니다.
    규칙 모양: 대상 { 속성: 값; }
  -->
  <style>
    /* 페이지 전체: 배경색, 글자 */
    body {
      margin: 0;
      background: #f3f4f6;
      color: #1b2230;
      font-family: system-ui, "Apple SD Gothic Neo", sans-serif;
      line-height: 1.6;
    }

    /* 가운데 정렬된 좁은 기둥: 휴대폰에서도 보기 좋게 */
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    h1 { margin: 0; font-size: 32px; }
    .sub { margin: 4px 0 24px; color: #5d6676; }

    /* 입력 영역: 칸과 버튼을 한 줄에, 좁으면 다음 줄로 */
    form { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
    .field { display: grid; gap: 4px; flex: 1 1 160px; }
    label { font-size: 13px; font-weight: 600; }
    input {
      padding: 10px 12px;
      border: 1px solid #dde1e8;
      border-radius: 8px;
      font-size: 15px;
    }

    /* 출석 버튼: 소방 적색 */
    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #c8321e;
      color: white;
      font-size: 15px;
      font-weight: 600;
    }

    /* 명단: 줄마다 구분선 */
    ul { list-style: none; padding: 0; border-top: 1px solid #dde1e8; }
    li { padding: 10px 2px; border-bottom: 1px solid #dde1e8; }
    .time { color: #5d6676; margin-right: 12px; }

    /* 정시/지각 표시: 색으로 구분 */
    .ok   { color: #1f7a4d; font-weight: 600; }
    .late { color: #a35f00; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>교육생 출석부</h1>
    <p class="sub">신임소방관 교육과정 · 09:00 이후 체크는 지각 처리</p>

    <form>
      <div class="field">
        <label for="name">교육생 이름</label>
        <input id="name" placeholder="예: 김소방">
      </div>
      <div class="field">
        <label for="no">교육생 번호</label>
        <input id="no" placeholder="예: 01">
      </div>
      <button type="submit">출석 체크</button>
    </form>

    <h2>오늘의 출석 명단</h2>
    <ul>
      <li><span class="time">08:41</span> 김소방 · 01 <span class="ok">정시</span></li>
      <li><span class="time">08:55</span> 이구조 · 02 <span class="ok">정시</span></li>
      <li><span class="time">09:07</span> 박구급 · 03 <span class="late">지각</span></li>
    </ul>
  </div>
</body>
</html>
