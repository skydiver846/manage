name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - "attendance-app/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        working-directory: attendance-app/functions
        run: npm ci

      # 프로젝트 IAM에 등록된 배포용 서비스 계정 키(JSON)를 저장소 Secret
      # FIREBASE_SERVICE_ACCOUNT 에 넣어야 이 단계가 동작한다.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Functions
        working-directory: attendance-app
        run: npx firebase-tools@13 deploy --only functions --project manage-784f4 --non-interactive
